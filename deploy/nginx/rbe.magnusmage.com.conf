# nginx site for rbe.magnusmage.com only. Scoped by server_name; it does not
# declare default_server and changes nothing global, so other sites on the
# same nginx are unaffected. Always run `nginx -t` before reloading.
#
# TLS: this file ships HTTP-only on purpose. After DNS resolves, run
#   certbot --nginx -d rbe.magnusmage.com
# which adds the certificate and the HTTPS redirect to this server block
# and nothing else.

server {
    listen 80;
    listen [::]:80;
    server_name rbe.magnusmage.com;

    # Built SPA (deploy.sh puts the build here)
    root /opt/rbe/src/web/dist;
    index index.html;

    # Hashed build assets are immutable; index.html must revalidate
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Control-plane paths proxied to uvicorn on localhost. The reviewer's
    # server-rendered page lives at /review on the backend, so /review and
    # /audit stay backend paths; the SPA's own routes (/caller/*,
    # /specialist/*) fall through to index.html below.
    location ~ ^/(health|docs|openapi\.json|session|tools|webhooks|review|audit)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    # SPA fallback: every other path serves the app shell
    location / {
        try_files $uri /index.html;
    }
}
