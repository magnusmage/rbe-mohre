[project]
name = "rbe"
version = "0.1.0"
description = "Resolve Before It Escalates — MoHRE worker-rights voice agent control plane"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Stage 1: correctness rules only. Sprint task: widen to E, W, I, B, UP
# once the team agrees import-order and style conventions in one PR.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = false            # sprint task: raise to strict on app/
files = ["app"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
