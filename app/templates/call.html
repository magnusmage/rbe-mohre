<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoHRE rights check - call</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:48px auto;padding:0 16px;line-height:1.5}
  button{font-size:16px;padding:10px 22px;border-radius:8px;border:1px solid #888;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  #status{color:#555}
  .note{font-size:13px;color:#777;margin-top:32px}
</style>
</head>
<body>
<h1>Worker rights check</h1>
<p>Voice call with MoHRE's AI assistant. Synthetic data only; this build holds no real records.</p>
<button id="start">Start call</button>
<button id="end" disabled>End call</button>
<p id="status" aria-live="polite">Ready</p>
<p class="note">The call is recorded. The assistant gives information, not legal advice;
qualified staff make every decision.</p>
<script type="module">
  // Pin the exact version you tested (npm view @elevenlabs/client version);
  // never load "latest" in a demo.
  import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client@0.7.1/+esm";
  let conv;
  const status = (t) => (document.getElementById("status").textContent = t);

  document.getElementById("start").onclick = async () => {
    try {
      await navigator.mediaDevices.getUserMedia({ audio: true });      // ask for the mic first
      const r = await fetch("/session/signed-url");                    // C1: our server, not ElevenLabs
      if (!r.ok) throw new Error("signed URL unavailable");
      const { signed_url } = await r.json();
      conv = await Conversation.startSession({                         // C3
        signedUrl: signed_url,
        onStatusChange: (s) => status(s.status),
        onError: () => status("Call error. Please try again or call 80084."),
        onDisconnect: () => { status("Call ended"); toggle(false); },
      });
      toggle(true);
    } catch (e) { status("Could not start the call: " + e.message); }
  };
  document.getElementById("end").onclick = () => conv && conv.endSession();
  function toggle(on){ document.getElementById("start").disabled = on; document.getElementById("end").disabled = !on; }
</script>
</body>
</html>
